name: Publish ForgeCore Releases
on:
  push:
    branches: [main]
    paths:
      - 'ForgeCore/server/**'
      - 'ForgeCore/compose.yaml'
      - 'ForgeCore/manage.sh'
      - 'ForgeCore/upgrade.sh'
      - 'ForgeCore/.env.example'
      - '.github/workflows/forgecore-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ForgeCore package and automated tests
        working-directory: ForgeCore/server
        run: |
          npm test
          npm run check
      - name: Confirm documented ZimaOS acceptance gate
        run: test -s ForgeCore/ACCEPTANCE-v1.0.0.md
      - name: Build ForgeCore Docker image
        run: docker build -t forgecore:release ForgeCore/server
      - name: Publish isolated ForgeCore version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./ForgeCore/server/package.json').version")
          TAG="forgecore-v${VERSION}"
          test "$VERSION" = "1.8.3"
          mkdir -p dist
          zip -qr "dist/ForgeCore-v${VERSION}-ZimaOS.zip" \
            ForgeCore/server ForgeCore/browser-agent ForgeCore/compose.yaml ForgeCore/.env.example ForgeCore/install.sh ForgeCore/manage.sh ForgeCore/upgrade.sh \
            ForgeCore/README.md ForgeCore/ROADMAP.md ForgeCore/CHANGELOG.md ForgeCore/ACCEPTANCE-v1.0.0.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "dist/ForgeCore-v${VERSION}-ZimaOS.zip" \
              --title "ForgeCore ${VERSION} – Browser-Scan-Warteschlange und Download-Vorabprüfung" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "ForgeCore v1.8.3: Beschränkte FIFO-Scanwarteschlange verhindert parallele Chromium-Analysen. Bessere Statusanzeige für beschäftigt, offline und Zeitüberschreitung, 429-Wiederholungen und keine irreführende UI-Vorabablehnung. Authentifizierte Vorabprüfung von Jellyfin-Speicher und ffmpeg/ffprobe vor Downloadstart. Keine DRM-/CAPTCHA-Umgehung; externe Hoster und erster realer Download weiterhin nur auf ZimaOS validierbar."
          fi
