name: Publish ForgeCore Releases
on:
  push:
    branches: [main]
    paths:
      - 'ForgeCore/server/package.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ForgeCore package and automated tests
        working-directory: ForgeCore/server
        run: |
          npm test
          npm run check
      - name: Build ForgeCore Docker image
        run: docker build -t forgecore:release ForgeCore/server
      - name: Publish isolated ForgeCore version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./ForgeCore/server/package.json').version")
          TAG="forgecore-v${VERSION}"
          test "$VERSION" = "0.9.9"
          mkdir -p dist
          zip -qr "dist/ForgeCore-v${VERSION}-ZimaOS.zip" \
            ForgeCore/server ForgeCore/compose.yaml ForgeCore/.env.example ForgeCore/install.sh ForgeCore/manage.sh \
            ForgeCore/README.md ForgeCore/ROADMAP.md ForgeCore/CHANGELOG.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "dist/ForgeCore-v${VERSION}-ZimaOS.zip" \
              --title "ForgeCore ${VERSION} – ZimaOS Phase 7 Beta Preview" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "ForgeCore v0.9.9 Beta-Vorschau für ZimaOS: Betriebsdiagnose, Docker-Installer, komplette Datenvolume-Sicherung, Healthcheck-Update und Rollback sowie Quellen- und Jellyfin-Verwaltung. Noch nicht auf realer ZimaOS-/SMB-Hardware abgenommen. Nicht als produktionsreifes v1.0.0 verwenden."
          fi
