name: ForgeCore Phase 6 CI
on:
  pull_request:
    paths:
      - "ForgeCore/**"
      - ".github/workflows/forgecore-ci.yml"
  push:
    branches: [main]
    paths:
      - "ForgeCore/**"
      - ".github/workflows/forgecore-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen StreamForge 1.8.1 snapshot
        run: |
          node --input-type=module -e "import fs from 'node:fs';let a=JSON.parse(fs.readFileSync('ForgeCore/browser-extension/manifest.json'));let b=JSON.parse(fs.readFileSync('ForgeCore/browser-extension/package.json'));if(a.version!=='1.8.1'||b.version!=='1.8.1')throw Error('ForgeCore snapshot must stay at StreamForge 1.8.1');"
      - name: Test frozen browser extension
        working-directory: ForgeCore/browser-extension
        run: npm test
      - name: Test ForgeCore ZimaOS server
        working-directory: ForgeCore/server
        run: |
          npm test
          npm run check
      - name: Validate ZimaOS installer shell
        run: bash -n ForgeCore/install.sh
      - name: Validate Docker Compose
        run: docker compose -f ForgeCore/compose.yaml config --quiet
      - name: Build ForgeCore image
        run: docker build -t forgecore:test ForgeCore/server

      - name: Smoke test Docker HTTP service
        run: |
          docker run --detach --name forgecore-ci --read-only --tmpfs /tmp --tmpfs /data:rw,uid=1000,gid=1000 -p 127.0.0.1:18787:8787 forgecore:test
          trap 'docker rm -f forgecore-ci || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18787/api/health >/tmp/forgecore-health.json; then break; fi
            sleep 1
          done
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/forgecore-health.json'));if(h.version!=='0.5.9'||h.ok!==true)process.exit(1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/api/media)" = 401
