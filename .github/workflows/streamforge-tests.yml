name: StreamForge Tests

on:
  push:
    branches: [main]
    paths:
      - 'StreamForge/**'
      - '.github/workflows/streamforge-tests.yml'
  pull_request:
    paths:
      - 'StreamForge/**'
      - '.github/workflows/streamforge-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 22 test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StreamForge
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check manifest version
        run: |
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(m.version!==p.version)throw Error('Version mismatch: '+m.version+' vs '+p.version);"
      - name: Run StreamForge tests
        run: npm test
      - name: Check extension assets and JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          for (const name of [m.background.service_worker,m.action.default_popup,...Object.values(m.icons),...m.content_scripts.flatMap(x=>x.js)]) {
            if (!fs.existsSync(name)) throw new Error('Missing extension asset: '+name);
          }
          NODE
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Bundle installable extension
        run: |
          mkdir -p ../dist/StreamForge
          cp -a *.js *.html popup.css manifest.json icons ../dist/StreamForge/
          cd ../dist && zip -qr StreamForge-v1.7.0.zip StreamForge
      - name: Upload Chrome extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StreamForge-v1.7.0-extension
          path: dist/StreamForge-v1.7.0.zip
          if-no-files-found: error
