name: Publish StreamForge Releases
on:
  push:
    branches: [main]
    paths:
      - 'StreamForge/manifest.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version and run regression suite
        working-directory: StreamForge
        run: |
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(!/^1[.](?:7[.](?:[4-9]|[1-9][0-9]+)|8[.](?:[0-9]|[1-9][0-9]+))$/.test(m.version)||m.version!==p.version)throw Error('Unsupported or inconsistent release version');"
          npm test
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Create extension ZIP and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('StreamForge/manifest.json','utf8')).version")
          TAG="v${VERSION}"
          mkdir -p dist/StreamForge
          cp -a StreamForge/*.js StreamForge/*.html StreamForge/popup.css StreamForge/manifest.json StreamForge/icons dist/StreamForge/
          (cd dist && zip -qr "StreamForge-${TAG}.zip" StreamForge)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "dist/StreamForge-${TAG}.zip" --title "StreamForge ${VERSION}" --target "$GITHUB_SHA" --notes "StreamForge ${VERSION}: changelog unter StreamForge/CHANGELOG.md. Automatische Tests bestanden; reale Browser- und ZimaOS-Speicherpfade müssen separat geprüft werden."
          fi
