name: Shared brand icons
on:
  push:
    branches: [main]
    paths:
      - 'branding/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python branding/render-icons.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'assets: render shared brand icons'
          file_pattern: 'StreamForge/icons/*.png ForgeCore/browser-extension/icons/*.png ForgeCore/server/public/favicon.png'
