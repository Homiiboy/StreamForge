name: Publish StreamForge 1.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.7.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version and run tests
        working-directory: StreamForge
        run: |
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(m.version!=='1.7.1'||p.version!==m.version)throw Error('Version mismatch');"
          npm test
      - name: Check extension assets and JavaScript syntax
        working-directory: StreamForge
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          for (const name of [m.background.service_worker,m.action.default_popup,...Object.values(m.icons),...m.content_scripts.flatMap(x=>x.js)]) {
            if (!fs.existsSync(name)) throw new Error('Missing extension asset: '+name);
          }
          NODE
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Create distributable zip
        run: |
          mkdir -p dist/StreamForge
          cp -a StreamForge/*.js StreamForge/*.html StreamForge/popup.css StreamForge/manifest.json StreamForge/icons dist/StreamForge/
          cd dist && zip -qr StreamForge-v1.7.1.zip StreamForge
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.7.1 dist/StreamForge-v1.7.1.zip --title 'StreamForge 1.7.1' --target "$GITHUB_SHA" --notes 'StreamForge 1.7.1: Stabilitätsupdate der persistenten Download-Warteschlange. Doppelte und beschädigte Einträge werden bei Wiederherstellung gefiltert; parallele Speicheroperationen werden vor dem Start neuer Downloads synchronisiert. Regressionstests erweitert. Die bekannten Grenzen zu bytegenauem Resume, Untertitel-Muxing und nicht abgeschlossener Browser-/ZimaOS-Abnahme gelten weiterhin.'
