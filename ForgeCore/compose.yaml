name: forgecore
services:
  forgecore:
    build:
      context: ./server
    image: forgecore:1.7.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${FORGECORE_TIMEZONE:-Europe/Vienna}
      FORGECORE_DB_PATH: /data/forgecore.sqlite
      FORGECORE_STAGING_ROOT: /data
      FORGECORE_MEDIA_ROOT: /media
      FORGECORE_HOST: 0.0.0.0
      FORGECORE_PORT: 8787
      FORGECORE_SECURE_COOKIE: ${FORGECORE_SECURE_COOKIE:-0}
      FORGECORE_TMDB_TOKEN: ${FORGECORE_TMDB_TOKEN:-}
      FORGECORE_BROWSER_AGENT_URL: http://forgecore-browser:8790
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - "${FORGECORE_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    volumes:
      - forgecore-data:/data
      - ${FORGECORE_MEDIA_HOST_PATH:-./media}:/media:rw
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    pids_limit: 100
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  forgecore-browser:
    profiles: ["browser"]
    build:
      context: ./browser-agent
    image: forgecore-browser:1.7.0
    restart: unless-stopped
    init: true
    shm_size: 512m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    pids_limit: 160
    mem_limit: 1536m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
      - seccomp:./browser-agent/seccomp_profile.json
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      HOME: /tmp
      FORGECORE_BROWSER_PORT: 8790
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  forgecore-data:
